name: Deploy to Firebase Functions

on:
  push:
    branches:
      - main # Triggers the pipeline whenever you push code to the main branch

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out your code
      - name: Checkout Repo
        uses: actions/checkout@v4

      # Step 2: Set up the Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './functions/package-lock.json'

      # Step 3: Install backend dependencies
      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
        working-directory: functions

      # Step 4: Compile TypeScript to JavaScript
      - name: Build TypeScript
        run: npm run build
        working-directory: functions

      # Step 5: Native Deployment using your verified Repository Secret
      - name: Deploy to Firebase
        run: |
          # 1. Install official Firebase tools cleanly on the runner
          npm install -g firebase-tools
          
          # 2. Deploy directly utilizing the verified token string
          firebase deploy --only functions --token "${{ secrets.FIREBASE_TOKEN }}" --project house-proj-fff2a
