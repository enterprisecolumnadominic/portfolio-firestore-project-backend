name: Deploy to Firebase Functions

on:
  push:
    branches:
      - main # Triggers the pipeline whenever you push code to the main branch

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out your code
      - name: Checkout Repo
        uses: actions/checkout@v4

      # Step 2: Set up the Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './functions/package-lock.json'

      # Step 3: Install backend dependencies
      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
        working-directory: functions

      # Step 4: Compile TypeScript to JavaScript
      - name: Build TypeScript
        run: npm run build
        working-directory: functions

      # Step 5: Deploy using your stable Service Account Key
      - name: Deploy to Firebase
        uses: w9jds/firebase-action@v15.22.0
        with:
          args: deploy --only functions
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HOUSE_PROJ_FFF2A }}
